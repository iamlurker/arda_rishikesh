    <style>

        *, .row, ::before, ::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
            font-family: 'Roboto', sans-serif;
        }
        ::-webkit-scrollbar{
            width: 12px;
            /* background-color: ; */
        }
        ::-webkit-scrollbar-track{
            -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.3);
            border-radius: 10px;
            background-color: #F5F5F5;
        }
        ::-webkit-scrollbar-thumb{
            border-radius: 10px;
            -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,.3);
            background-color: #555;
        }
        a{
            text-decoration: none;
            color: black;
        }
        h1{
            background: -webkit-linear-gradient(#e52d27, #b31217);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        html,
        body {
            background-color: whitesmoke;
            /* background: linear-gradient(45deg, #190f2c, #200b30); */
            /* background: linear-gradient(#190f2c, #DDD6E1, #200b30); */
            scroll-behavior: smooth;
            font-family: 'Roboto', sans-serif;
        }
        /* body {
            font-family: roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;

        .tile-container{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            padding: 2rem 3rem;
        }
        .tile{
            width: 40%;
            height: 20%;
            text-align: center;
        }


        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
            display: inline-block;
        }

        /* Main CSS */
        .grid-wrapper > div {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .grid-wrapper > div > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
            /* transition: transform 0.3s ease; */    
            transition: .4s ease;
            cursor: pointer;
        }
        .grid-wrapper > div > img:hover{
            border-radius: 2rem !important ;
            padding: 1.3rem;
        }

        .grid-wrapper {
            display: grid;
            grid-gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            grid-auto-rows: 280px;
            grid-auto-flow: dense;            
            padding: 0px 3rem;
        }
        .grid-wrapper .wide {
            grid-column: span 2;
        }
        .grid-wrapper .tall {
            grid-row: span 2;
        }
        .grid-wrapper .big {
            grid-column: span 2;
            grid-row: span 2;
        }

        @media (min-width: 1000px) {
            .grid-wrapper {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .home {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .home-content {
            position: relative;
            padding-top: 150px;
            color: #fff;
            text-align: center;
        }
        .home h1 {
            font-size: clamp(45px, 7vw, 130px);
            line-height: 1.1;
        }

        .home p {
            font-size: clamp(25px, 4vw, 40px);
            margin-top: 10px;
        }

        .home-content button {
            display: block;
            font-size: clamp(14px, 1.5vw, 18px);
            border: 1px solid #f1f1f1;
            border-radius: 5px;
            background: transparent;
            color: #fff;
            margin: 50px auto 0;
            padding: 12px 20px;
            cursor: pointer;
        }
        .video-container{
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: auto;
            width: 100%;
            padding-top: 2rem;
        }
        .video-div{
            width: 100%;
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }
        .video{
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 1rem;
        }
        /*--------------------------------------------------------------
            #button-style
        --------------------------------------------------------------*/
        .theme-btn, .theme-btn-s2{
            background-color: #ffffff;
            font-size: 20px;
        font-weight: 500;
        line-height: 1.4;
        text-align: center;
        color:#2b3b95;
            padding: 9px 32px;
            border: 0; 
        border-radius: .7rem;
            text-transform: uppercase;
            display: inline-block;
            line-height: initial;
        transition:all .4s ease;
        }
        a {
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .theme-btn-s2{
            background-color: rgba(255, 255, 255, 0.9);
            color: #131e4a;
        }
        .theme-btn:hover, .theme-btn-s2:hover, .theme-btn:focus, .theme-btn-s2:focus, .theme-btn:active, .theme-btn-s2:active {
            background-color:#2b3b95 ;
            color: #fff;
        }
        .theme-btn-s3{
        font-size: 16px;
        font-weight: 500;
        line-height: 1.5;
        color: #ffffff;
        text-transform: uppercase;
        }
        i.fa-chevron-circle-right{
        height:22px;
        width:22px;
        }
        a:hover {
            text-decoration: none;
        }
        @media (max-width: 991px){
        .theme-btn, .theme-btn-s2, .theme-btn-s3 {
            font-size: 13px;
            padding: 15px 25px;
        }
        }
        @media (max-width: 767px){
        .theme-btn, .theme-btn-s2{
            padding: 13px 20px;
            font-size: 13px;
        }
        }
    </style>
</head>
